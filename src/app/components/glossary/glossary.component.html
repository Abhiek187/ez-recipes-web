@if (isLoading()) {
  <mat-spinner diameter="40" class="progress-spinner" />
} @else {
  <mat-list>
    @for (term of sortedTerms(); track term._id) {
      <mat-list-item class="term-list">
        <span class="term-line">
          <b>{{ term.word }}</b> — {{ term.definition }}
        </span>
      </mat-list-item>
      <!-- Don't add a divider below the last item -->
      @if (!$last) {
        <mat-divider />
      }
    }
  </mat-list>
}
